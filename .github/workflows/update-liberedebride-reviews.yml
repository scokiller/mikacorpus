name: Actualiser les avis Libéré Débridé

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-liberedebride-reviews.yml
      - liberatedebride/update_reviews.py

permissions:
  contents: write

concurrency:
  group: liberatedebride-google-reviews
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer les 36 avis validés
        uses: actions/checkout@v4

      - name: Vérifier les protections avant toute collecte
        shell: bash
        run: |
          python3 -m py_compile liberatedebride/update_reviews.py
          python3 - <<'PY'
          import json
          data=json.load(open('liberedebride/reviews.json',encoding='utf-8'))
          reviews=data['reviews']
          assert len(reviews) >= 36
          assert len({review['id'] for review in reviews}) == len(reviews)
          assert sum(review.get('profile') == 'legacy' for review in reviews) == 19
          assert data.get('legacyAutoUpdate') is False
          print(f"Base protégée : {len(reviews)} avis uniques, dont 19 historiques figés.")
          PY

      - name: Préparer les vues récentes de la fiche actuelle uniquement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = "https://www.google.com/maps/place/DIAGNOSTIC+AUTO+GRASSE/@43.6188628,6.9774692,17z/data=!3m1!4b1!4m6!3m5!1s0x12cc29f3960124d1:0x6fc336e5fc06944e!8m2!3d43.6188628!4d6.9774692!16s%2Fg%2F11xztw0yyt"
          urls = [("https://www.google.com/maps?cid=8053340920072279118&hl=fr&gl=FR", "cid-fr")]
          for lang in ("fr", "en"):
              urls.append((f"{base}?hl={lang}&gl=FR", f"default-{lang}"))
              for sort in range(4):
                  urls.append((f"{base}!9m1!1b{sort}?hl={lang}&gl=FR", f"sort-{sort}-{lang}"))
          Path("current-review-queries.txt").write_text(
              "\n".join(f"{url} #!#{label}" for url, label in urls) + "\n",
              encoding="utf-8",
          )
          print(f"{len(urls)} vues de la fiche actuelle; aucune requête vers MR Performance.")
          PY

      - name: Lire les nouveaux avis publics
        continue-on-error: true
        shell: bash
        run: |
          rm -rf current-review-output
          mkdir -p current-review-output
          docker pull gosom/google-maps-scraper:latest
          docker run --rm \
            -e DISABLE_TELEMETRY=1 \
            -v gmaps-playwright-cache:/opt \
            -v "$PWD/current-review-queries.txt:/queries.txt:ro" \
            -v "$PWD/current-review-output:/out" \
            gosom/google-maps-scraper:latest \
            -input /queries.txt \
            -results /out/results.json \
            -json \
            -extra-reviews \
            -depth 1 \
            -c 2 \
            -lang fr \
            -exit-on-inactivity 2m

      - name: Fusionner sans suppression, doublon ni fausse date
        if: always()
        run: python3 liberatedebride/update_reviews.py

      - name: Publier uniquement un ajout ou un enrichissement fiable
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- liberatedebride/reviews.json; then
            echo "Aucun changement fiable; la base validée reste intacte."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liberatedebride/reviews.json
          git commit -m "data: actualiser les avis Google Libéré Débridé"
          git push
