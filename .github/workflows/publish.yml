name: Publish Mika Corpus PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current Mika Corpus PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site
          mkdir -p /tmp/site/vendor
          base='https://mikacorpus-lab.netlify.app'
          files=(
            index.html
            app.js
            v08.js
            mkc5.js
            build.json
            manifest.webmanifest
            icon-192.png
            icon-512.png
            pre-tf-r4.js
            post-tf-core-r4.js
            post-tf-webgpu-r4.js
            vendor/tfjs-4.22.0-r4.min.js
            vendor/tfjs-backend-webgpu-4.22.0-r4.js
            sw.js
          )
          for f in "${files[@]}"; do
            mkdir -p "/tmp/site/$(dirname "$f")"
            curl --fail --silent --show-error --location --retry 3 "$base/$f" -o "/tmp/site/$f"
            test -s "/tmp/site/$f"
          done
          cp /tmp/site/index.html /tmp/site/404.html
          touch /tmp/site/.nojekyll

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mika Corpus Pages Bot'
          git config user.email 'scokiller@users.noreply.github.com'
          git checkout --orphan gh-pages-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/site/. .
          git add -A
          git commit -m 'Publish Mika Corpus PWA'
          git branch -M gh-pages
          git push --force origin gh-pages
